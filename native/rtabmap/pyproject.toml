[build-system]
requires = ["scikit-build-core==0.11.6", "cmake==3.31.6", "ninja==1.11.1.1"]
build-backend = "scikit_build_core.build"

[project]
name = "campervan-rtabmap"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[tool.scikit-build]
build-dir = "../../.local/native-rtabmap/build/{wheel_tag}"
wheel.packages = ["src/campervan_rtabmap"]
