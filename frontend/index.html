<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campervan CAD</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header><h1>Campervan CAD</h1></header>
    <main>
      <aside aria-label="Model parameters">
        <h2>Parameters</h2>
        <form id="parameters" novalidate>
          <div class="parameter-row">
            <label id="size-label" for="size">Size</label>
            <div class="input-row">
              <input id="size" name="size_mm" type="number" step="any" aria-describedby="bounds" autocomplete="off" />
              <span id="unit"></span>
            </div>
          </div>
          <p id="bounds" class="visually-hidden">Connecting to the API…</p>
          <div class="actions">
            <button type="submit">Apply</button>
            <button id="regenerate" type="button">Regenerate</button>
          </div>
        </form>
        <div class="feedback" aria-live="polite" aria-atomic="true">
          <p id="status" role="status">Connecting…</p>
          <p id="error" hidden></p>
        </div>
      </aside>
      <iframe id="viewer" title="Interactive CAD viewer" allow="fullscreen"></iframe>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
