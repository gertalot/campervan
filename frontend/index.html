<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campervan CAD</title>
  </head>
  <body>
    <main>
      <header>
        <div><p class="eyebrow">Campervan CAD</p><h1>Cube</h1></div>
        <p class="hint">Rotate and zoom in the viewer to explore the model.</p>
      </header>
      <section class="controls" aria-label="Model parameters">
        <form id="parameters" novalidate>
          <div class="field">
            <label id="size-label" for="size">Size</label>
            <div class="input-row"><input id="size" name="size_mm" type="number" step="any"
              aria-describedby="bounds" autocomplete="off" /><span id="unit"></span></div>
            <p id="bounds" class="hint">Connecting to the API…</p>
          </div>
          <button type="submit">Apply</button>
        </form>
        <button id="regenerate" class="secondary" type="button">Regenerate</button>
      </section>
      <div class="feedback" aria-live="polite" aria-atomic="true">
        <p id="status" role="status">Connecting…</p>
        <p id="error" hidden></p>
      </div>
      <iframe id="viewer" title="Interactive CAD viewer" allow="fullscreen"></iframe>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
