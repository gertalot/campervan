<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campervan CAD</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header><h1>Campervan CAD</h1><nav aria-label="Project views">
      <button id="cad-tab" aria-controls="cad-panel" aria-pressed="true">CAD</button>
      <button id="scan-tab" aria-controls="scan-panel" aria-pressed="false">Scan</button>
      <button id="bom-tab" aria-controls="bom-panel" aria-pressed="false">Bill of materials</button>
      <button id="plan-tab" aria-controls="plan-panel" aria-pressed="false">Plan</button>
      <button id="cuts-tab" aria-controls="cuts-panel" aria-pressed="false">Cut list</button>
      <button id="apriltags-tab" aria-controls="apriltags-panel" aria-pressed="false">AprilTags</button>
    </nav><p id="status" role="status" aria-live="polite" aria-atomic="true">Connecting…</p></header>
    <main id="workspace">
    <section id="cad-panel" aria-label="CAD">
      <aside id="sidebar" aria-label="Model parameters">
        <div id="live-controls" aria-label="Live controls">
          <div id="cabinet-side-control" class="parameter-row cabinet-side-row">
            <span id="cabinet-side-label">Cabinet side</span>
            <div class="segmented-choice" role="radiogroup" aria-labelledby="cabinet-side-label"
              title="Vehicle sides when facing the windscreen">
              <label><input type="radio" name="cabinet-side" value="left" checked /><span>Left</span></label>
              <label><input type="radio" name="cabinet-side" value="right" /><span>Right</span></label>
            </div>
          </div>
        </div>
        <fieldset id="visibility">
          <legend>Visibility</legend>
          <label><input type="checkbox" name="vehicle" checked /> Vehicle</label>
          <label><input type="checkbox" name="wheelArches" checked /> Wheel arches</label>
          <label><input type="checkbox" name="woodenFloor" checked /> Wooden floor</label>
          <label><input type="checkbox" name="slats" checked /> Slats</label>
          <label><input type="checkbox" name="cushions" checked /> Cushions</label>
          <label><input type="checkbox" name="cabinet" checked /> Cabinet</label>
          <label><input type="checkbox" name="cabinetShelves" checked /> Cabinet shelves</label>
          <label><input type="checkbox" name="cabinetDoors" checked /> Cabinet doors</label>
          <label><input type="checkbox" name="cabinetSkin" checked /> Cabinet skin</label>
          <label><input type="checkbox" name="cabinetFrames" checked /> Cabinet frames</label>
          <label><input type="checkbox" name="storedGear" checked /> Stored gear</label>
          <label><input type="checkbox" name="longBench" checked /> Long bench</label>
          <label><input type="checkbox" name="crossBench" checked /> Cross bench</label>
          <label><input type="checkbox" id="mannequin-visible" /> Mannequin</label>
          <label class="see-inside"><input type="checkbox" id="see-inside" /> See inside</label>
        </fieldset>
        <fieldset id="scan-reference" hidden>
          <legend>Scan reference</legend>
        </fieldset>
        <fieldset id="build-components" aria-describedby="build-components-hint">
            <legend>Included in build</legend>
            <div id="build-component-fields"></div>
            <p id="build-components-hint">Updates cut lists and BOM automatically. Excluded items are hidden; re-including restores their eye settings.</p>
            <p id="build-components-status" role="status" aria-live="polite" aria-atomic="true"></p>
        </fieldset>
        <form id="parameters" novalidate>
          <h2>Model parameters</h2>
          <p class="dimension-hint">Dimensions · mm</p>
          <div class="actions">
            <button type="submit">Apply</button>
            <button id="regenerate" type="button">Regenerate</button>
          </div>
          <div id="fields"><details id="mannequin"></details></div>
        </form>
        <div class="feedback" aria-live="polite" aria-atomic="true">
          <p id="error" hidden></p>
        </div>
      </aside>
      <div id="sidebar-resizer" role="separator" tabindex="0" aria-label="Sidebar width"
        aria-orientation="vertical" aria-controls="sidebar"></div>
      <div id="viewer" aria-label="Interactive CAD viewer"></div>
    </section>
    <section id="plan-panel" aria-label="Conversion plan" hidden></section>
    <section id="scan-panel" aria-label="Scan reconstruction" hidden></section>
    <section id="bom-panel" aria-label="Bill of materials" hidden></section>
    <section id="cuts-panel" aria-label="Cut list and layouts" hidden></section>
    <section id="apriltags-panel" aria-label="AprilTag PDF generator" hidden></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
