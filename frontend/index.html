<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campervan CAD</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header><h1>Campervan CAD</h1></header>
    <main>
      <aside aria-label="Model parameters">
        <h2>Vehicle reference</h2>
        <p class="dimension-hint">Provisional dimensions · mm</p>
        <form id="parameters" novalidate>
          <div id="fields"></div>
          <div class="actions">
            <button type="submit">Apply</button>
            <button id="regenerate" type="button">Regenerate</button>
          </div>
        </form>
        <div class="feedback" aria-live="polite" aria-atomic="true">
          <p id="status" role="status">Connecting…</p>
          <p id="error" hidden></p>
        </div>
      </aside>
      <iframe id="viewer" title="Interactive CAD viewer" allow="fullscreen"></iframe>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
