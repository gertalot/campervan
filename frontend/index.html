<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campervan CAD</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header><h1>Campervan CAD</h1><nav aria-label="Project views">
      <button id="cad-tab" aria-controls="cad-panel" aria-pressed="true">CAD</button>
      <button id="bom-tab" aria-controls="bom-panel" aria-pressed="false">Bill of materials</button>
    </nav><p id="status" role="status" aria-live="polite" aria-atomic="true">Connecting…</p></header>
    <main id="workspace">
    <section id="cad-panel" aria-label="CAD">
      <aside id="sidebar" aria-label="Model parameters">
        <div id="live-controls" aria-label="Live controls"></div>
        <fieldset id="visibility">
          <legend>Visibility</legend>
          <label><input type="checkbox" name="vehicle" checked /> Vehicle</label>
          <label><input type="checkbox" name="slats" checked /> Slats</label>
          <label><input type="checkbox" name="cushions" checked /> Cushions</label>
          <label><input type="checkbox" name="cabinet" checked /> Cabinet</label>
          <label><input type="checkbox" name="cabinetBacking" checked /> Cabinet backing</label>
          <label><input type="checkbox" name="storedGear" checked /> Stored gear</label>
          <label><input type="checkbox" name="longBench" checked /> Long bench</label>
          <label><input type="checkbox" name="crossBench" checked /> Cross bench</label>
          <label><input type="checkbox" id="mannequin-visible" /> Mannequin</label>
          <label class="see-inside"><input type="checkbox" id="see-inside" /> See inside</label>
        </fieldset>
        <h2>Model parameters</h2>
        <p class="dimension-hint">Dimensions · mm</p>
        <form id="parameters" novalidate>
          <div class="actions">
            <button type="submit">Apply</button>
            <button id="regenerate" type="button">Regenerate</button>
          </div>
          <div id="fields"><details id="mannequin"></details></div>
        </form>
        <div class="feedback" aria-live="polite" aria-atomic="true">
          <p id="error" hidden></p>
        </div>
      </aside>
      <div id="sidebar-resizer" role="separator" tabindex="0" aria-label="Sidebar width"
        aria-orientation="vertical" aria-controls="sidebar"></div>
      <div id="viewer" aria-label="Interactive CAD viewer"></div>
    </section>
    <section id="bom-panel" aria-label="Bill of materials" hidden></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
