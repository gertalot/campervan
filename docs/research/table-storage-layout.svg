<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940"><style>text{font-family:Arial,sans-serif}.small{font-size:12px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#344252"/></marker></defs><rect width="1200" height="940" fill="#faf9f5"/><text x="35" y="32" fill="#162532" font-size="23">Table storage candidates: current NV200 dimensions</text><text x="35" y="55" fill="#52606c" font-size="13">Concept layout. Dimensions in mm. Retainers need detailing; cab-seat references need measurement.</text><text x="60" y="88" fill="#28313c" font-size="16">PLAN: cab / front at top</text><rect x="60" y="117.79999999999995" width="480" height="627.2" fill="#eeeae0" stroke="#424b55" /><rect x="74.08" y="393" width="123.52" height="320" fill="#efc780" stroke="#424b55" /><rect x="342.24" y="303.4" width="197.76" height="409.6" fill="#8fbad4" stroke="#424b55" /><rect x="197.6" y="117.79999999999995" width="342.40000000000003" height="185.6" fill="#8fbad4" stroke="#424b55" /><rect x="197.6" y="333.8" width="150.4" height="350.40000000000003" fill="#e99d9d" stroke="#bd6565" fill-opacity=".15" stroke-dasharray="6 4"/><rect x="261.6" y="117.79999999999995" width="5.76" height="182.72" fill="#a0703a" stroke="#424b55" /><rect x="261.6" y="300.52" width="230.4" height="2.88" fill="#a0703a" stroke="#424b55" /><rect x="197.6" y="117.79999999999995" width="64" height="185.6" fill="none" stroke="#536a86" stroke-dasharray="3 3"/><rect x="103.52000000000001" y="113.31999999999994" width="89.60000000000001" height="150.4" fill="#c5c9cc" stroke="#424b55" /><rect x="95.2" y="346.59999999999997" width="86.4" height="46.4" fill="#5ca17d" stroke="#1f6343" fill-opacity=".95"/><rect x="210.4" y="100.19999999999993" width="48" height="230.4" fill="#9982bf" stroke="#63468b" fill-opacity=".9"/><text x="92" y="197.79999999999995" fill="#28313c" font-size="12">Chilly</text><text x="92" y="217" fill="#28313c" font-size="12">bin</text><text x="185" y="213.79999999999995" fill="#28313c" font-size="14">Cross bench</text><text x="370" y="537" fill="#28313c" font-size="14">Long bench</text><text x="92" y="553" fill="#28313c" font-size="14">Cabinet</text><text x="260" y="476.2" fill="#28313c" font-size="15">Aisle</text><path d="M143.2 370.59999999999997 L284 370.59999999999997" stroke="#344252" stroke-width="2" marker-end="url(#arrow)"/><path d="M232.8 242.59999999999997 L232.8 479.4" stroke="#344252" stroke-width="2" marker-end="url(#arrow)"/><text x="61" y="777" fill="#28313c" font-size="13">Rear opening</text><text x="60" y="804" fill="#1f6343" font-size="14">Green: rejected cabinet-end location.</text><text x="60" y="826" fill="#63468b" font-size="14">Purple: selected overhang location (250mm tall).</text><text x="60" y="848" fill="#a04c4c" font-size="13">Red dashed area: moving bed-frame sweep.</text><text x="60" y="870" fill="#28313c" font-size="13">Arrows: proposed retrieval towards the aisle.</text><text x="60" y="892" fill="#28313c" font-size="12">Cooler blocks a simple sideways exit from purple rack.</text><text x="650" y="91" fill="#1f6343" font-size="18">A. Rejected: obstructs entry to aisle</text><rect x="676.4" y="115" width="217.79999999999998" height="315" fill="#efc780" stroke="#a0703a"/><rect x="722" y="214" width="150" height="210" rx="6" fill="#5ca17d" stroke="#1f6343" stroke-width="2"/><path d="M716 418v12h170v-12" fill="none" stroke="#1f6343" stroke-width="6"/><path d="M713 259h170" stroke="#344252" stroke-width="7"/><rect x="870.2" y="252" width="14" height="14" rx="2" fill="#344252"/><line x1="908" y1="115" x2="908" y2="430" stroke="#bd6565" stroke-dasharray="6 4"/><text x="930" y="200" fill="#a04c4c" font-size="13">Bed starts</text><text x="930" y="220" fill="#a04c4c" font-size="13">at X=430</text><text x="710" y="310" fill="#fff" font-size="14">700 high</text><text x="714" y="331" fill="#fff" font-size="14">250 wide</text><text x="650" y="465" fill="#28313c" font-size="13">Two bottom supports + pads + retaining strap.</text><text x="650" y="488" fill="#28313c" font-size="13">Rack depth budget: about 145mm from cabinet face.</text><text x="650" y="511" fill="#28313c" font-size="13">Lift 15–20mm; move sideways into aisle.</text><text x="650" y="534" fill="#28313c" font-size="12">The left-door opening loses about 35mm at its rear edge.</text><text x="650" y="581" fill="#63468b" font-size="17">B. Selected: resolve clearance and restraints</text><rect x="765" y="664" width="290" height="7.2" fill="#8fbad4" stroke="#536a86"/><rect x="665" y="671.2" width="52.5" height="148.8" fill="#e99d9d" fill-opacity=".6" stroke="#bd6565"/><rect x="727.5" y="716" width="350" height="100" rx="5" fill="#9982bf" stroke="#63468b" stroke-width="2"/><path d="M650 820H1055V827.2H1150" fill="none" stroke="#424b55" stroke-width="3"/><path d="M1055 680V830" stroke="#777" stroke-dasharray="5 4"/><text x="760" y="648" fill="#28313c" font-size="13">Slat underside Z=372</text><text x="765" y="751" fill="#fff" font-size="14">700 × 250mm package</text><text x="650" y="846" fill="#28313c" font-size="12">20mm behind package to moving frame; rack also needs clearance.</text><text x="650" y="869" fill="#28313c" font-size="12">Package projects 45mm past wooden floor; cab floor is 18mm lower.</text><text x="650" y="892" fill="#28313c" font-size="13">Pull rearward along the van, before extending the bed.</text></svg>