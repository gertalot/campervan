<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" role="img" aria-labelledby="title"><title id="title">NV200 full bed with sliding toilet, 40 by 70 centimetre deployed space</title><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#26394b}.h{font-size:24px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.dim{stroke:#53697b;stroke-width:1.2;marker-start:url(#a);marker-end:url(#a)}.bed{fill:#bedbf1;stroke:#557b98}.cab{fill:#e2d1b4;stroke:#8c7354}.floor{fill:#f9f5fa;stroke:#a44684;stroke-dasharray:4 2}.toilet{fill:white;stroke:#a44684}</style><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53697b"/></marker></defs><rect width="1280" height="1000" fill="white"/><text x="40" y="43" class="h">Full bed + sliding toilet · NIGHT MODE</text><text x="40" y="77" class="b">150 × 186 cm cargo bay · 110 × 186 cm bed · Agreed provisional toilet-use space: 40 × 70 cm</text><text x="85" y="128" class="h" text-anchor="start">1. Toilet stowed</text><text x="272.5" y="176" class="b" text-anchor="middle">REAR DOORS</text><g transform="translate(85 190) scale(2.5)"><path d="M10 0H150V186H0V10A10 10 0 0 1 10 0Z" fill="#fafbfc" stroke="#26394b" stroke-width="1"/><path d="M10 0H110V186H0V10A10 10 0 0 1 10 0Z" class="bed"/><rect x="110" width="40" height="116" class="cab"/><rect x="110" y="116" width="40" height="70" class="floor"/><rect x="71.5" y="144" width="37" height="42" rx="4" fill="none" stroke="#a44684" stroke-dasharray="3 2" stroke-width="1"/><ellipse cx="90" cy="161" rx="10" ry="12" fill="#f1dce9" fill-opacity=".5" stroke="#a44684" stroke-dasharray="2 2" stroke-width=".7"/></g><text x="220" y="350" class="h" text-anchor="middle">BED</text><text x="220" y="384" class="b" text-anchor="middle">110 × 186</text><text x="220" y="415" class="s" text-anchor="middle">Extended in both views</text><text transform="translate(410 335) rotate(-90)" class="b" text-anchor="middle">CABINETRY · 40 × 116</text><text x="410" y="508" class="s" text-anchor="middle">Clear floor</text><text x="410" y="529" class="s" text-anchor="middle">40 × 70</text><text x="310" y="595" class="s" text-anchor="middle">37 × 42</text><text x="310" y="620" class="s" text-anchor="middle">under bed</text><line x1="85" y1="151" x2="460" y2="151" class="dim"/><text x="272.5" y="145" class="s" text-anchor="middle">150</text><line x1="60" y1="190" x2="60" y2="655" class="dim"/><text transform="translate(48 422.5) rotate(-90)" class="s" text-anchor="middle">186</text><line x1="85" y1="685" x2="360" y2="685" class="dim"/><line x1="360" y1="685" x2="460" y2="685" class="dim"/><text x="222.5" y="707" class="s" text-anchor="middle">110 bed</text><text x="410" y="707" class="s" text-anchor="middle">40 strip</text><text x="272.5" y="741" class="b" text-anchor="middle">CAB / FRONT SEATS</text><text x="700" y="128" class="h" text-anchor="start">2. Toilet deployed</text><text x="887.5" y="176" class="b" text-anchor="middle">REAR DOORS</text><g transform="translate(700 190) scale(2.5)"><path d="M10 0H150V186H0V10A10 10 0 0 1 10 0Z" fill="#fafbfc" stroke="#26394b" stroke-width="1"/><path d="M10 0H110V186H0V10A10 10 0 0 1 10 0Z" class="bed"/><rect x="110" width="40" height="116" class="cab"/><rect x="110" y="116" width="40" height="70" class="floor"/><rect x="71.5" y="144" width="37" height="42" rx="4" fill="none" stroke="#a44684" stroke-dasharray="3 2" stroke-width="1"/><rect x="111.5" y="144" width="37" height="42" rx="4" class="toilet"/><ellipse cx="130" cy="161" rx="10" ry="12" fill="#f1dce9" stroke="#a44684" stroke-width=".7"/><path d="M130 144V135" stroke="#a44684" marker-end="url(#a)"/><path d="M90 180H130" stroke="#a44684" marker-end="url(#a)"/></g><text x="835" y="350" class="h" text-anchor="middle">BED</text><text x="835" y="384" class="b" text-anchor="middle">110 × 186</text><text x="835" y="415" class="s" text-anchor="middle">Extended in both views</text><text transform="translate(1025 335) rotate(-90)" class="b" text-anchor="middle">CABINETRY · 40 × 116</text><text x="1025" y="508" class="s" text-anchor="middle">28 cm leg /</text><text x="1025" y="529" class="s" text-anchor="middle">foot space</text><text x="1025" y="621" class="s" text-anchor="middle">37 × 42</text><text x="925" y="582" class="s" text-anchor="middle">Stowed</text><text x="925" y="605" class="s" text-anchor="middle">under bed</text><line x1="700" y1="151" x2="1075" y2="151" class="dim"/><text x="887.5" y="145" class="s" text-anchor="middle">150</text><line x1="675" y1="190" x2="675" y2="655" class="dim"/><text transform="translate(663 422.5) rotate(-90)" class="s" text-anchor="middle">186</text><line x1="700" y1="685" x2="975" y2="685" class="dim"/><line x1="975" y1="685" x2="1075" y2="685" class="dim"/><text x="837.5" y="707" class="s" text-anchor="middle">110 bed</text><text x="1025" y="707" class="s" text-anchor="middle">40 strip</text><text x="887.5" y="741" class="b" text-anchor="middle">CAB / FRONT SEATS</text><line x1="1107" y1="480" x2="1107" y2="655" class="dim"/><text transform="translate(1127 567.5) rotate(-90)" class="s" text-anchor="middle">70 total = 28 + 42</text><text x="85" y="792" class="b" text-anchor="start">Same full bed: no mattress notch or width reduction.</text><text x="85" y="825" class="b" text-anchor="start">Toilet slides sideways while facing rearwards (up the drawing).</text><text x="85" y="858" class="b" text-anchor="start">The front 70 cm of the cabinetry strip becomes open floor; 116 cm remains for cabinetry.</text><text x="85" y="900" class="s" text-anchor="start">Assumptions: elbow room above the bed; foam underside 45 cm, seat top 55 cm. Toilet mounting / bed frame not detailed.</text><text x="85" y="930" class="s" text-anchor="start">Night geometry only: the shown stowage bay is under the extended bed; fit beneath the narrower daytime bench is unresolved.</text><text x="85" y="960" class="s" text-anchor="start">Dashed toilet is below the bed. Its position and 40 cm sideways movement are a geometric concept, not selected rail hardware.</text></svg>
