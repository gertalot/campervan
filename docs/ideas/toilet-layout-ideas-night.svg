<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">NV200 toilet layout ideas — beds extended</title><desc id="desc">Three provisional layouts within a 150 by 186 centimetre cargo rectangle. Toilet body 40 by 48 centimetres; reserved use zone 65 by 83 centimetres.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#23364b}.h{font-size:24px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.strong{font-weight:700}.bed{fill:#bfdbf4;stroke:#456b91;stroke-width:2}.cab{fill:#e2d2b7;stroke:#8a7354;stroke-width:2}.zone{fill:#f6e4f0;stroke:#ad4c8b;stroke-width:2;stroke-dasharray:7 5}.toilet{fill:white;stroke:#93356f;stroke-width:2}</style><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#50647a"/></marker></defs><rect width="1440" height="1000" fill="#fff"/><text x="45" y="46" class="h">Toilet layout ideas · NIGHT MODE</text><text x="45" y="78" class="b">150 × 186 cm cargo bay · All dimensions in cm · Concept sketches, not certified installations</text><text x="70" y="123" class="h" text-anchor="start">A. Straight single bed</text><text x="250" y="174" class="s strong" text-anchor="middle">REAR DOORS</text><g transform="translate(70 190) scale(2.4)"><rect width="150" height="186" fill="#fbfcfd" stroke="#23364b" stroke-width="1"/><rect x="0" y="0" width="85" height="186" class="bed"/><rect x="110" y="0" width="40" height="103" class="cab"/><rect x="85" y="103" width="65" height="83" class="zone"/><rect x="97.5" y="103" width="40" height="48" rx="5" class="toilet"/><ellipse cx="117.5" cy="130" rx="12" ry="15" fill="#f8edf5" stroke="#93356f" stroke-width=".8"/><path d="M117.5 157V172" stroke="#93356f" stroke-width="1.2" marker-end="url(#arrow)"/></g><text x="250" y="663.4" class="s strong" text-anchor="middle">CAB / FRONT SEATS</text><line x1="70" y1="151" x2="430" y2="151" stroke="#50647a" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="250" y="145" class="s" text-anchor="middle">150 cm</text><line x1="48" y1="190" x2="48" y2="636.4" stroke="#50647a" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text transform="translate(39 413.2) rotate(-90)" class="s" text-anchor="middle">186 cm</text><text x="170" y="370" class="b strong" text-anchor="middle">85 × 186</text><text x="170" y="395" class="s strong" text-anchor="middle">SINGLE BED</text><text transform="translate(382 313.6) rotate(-90)" class="s strong" text-anchor="middle">CABINETRY · 40 × 103</text><text x="352" y="492.4" class="s strong" text-anchor="middle">TOILET</text><text x="352" y="538" class="s" text-anchor="middle">40 × 48</text><text x="352" y="624.4" class="s" text-anchor="middle">35 clear</text><text transform="translate(304 310) rotate(-90)" class="s" text-anchor="middle">25 cm gap</text><text x="352" y="681" class="s" text-anchor="middle">65 cm wide</text><text x="70" y="712" class="b" text-anchor="start">Keeps an 85 cm single bed.</text><text x="70" y="740" class="b" text-anchor="start">Largest continuous floor area.</text><text x="70" y="768" class="b" text-anchor="start">Toilet at front; original bed becomes narrower.</text><text x="545" y="123" class="h" text-anchor="start">B. Front toilet + foot notch</text><text x="725" y="174" class="s strong" text-anchor="middle">REAR DOORS</text><g transform="translate(545 190) scale(2.4)"><rect width="150" height="186" fill="#fbfcfd" stroke="#23364b" stroke-width="1"/><path d="M0 0H110V103H85V186H0Z" class="bed"/><rect x="110" y="0" width="40" height="103" class="cab"/><rect x="85" y="103" width="65" height="83" class="zone"/><rect x="97.5" y="103" width="40" height="48" rx="5" class="toilet"/><ellipse cx="117.5" cy="130" rx="12" ry="15" fill="#f8edf5" stroke="#93356f" stroke-width=".8"/><path d="M117.5 157V172" stroke="#93356f" stroke-width="1.2" marker-end="url(#arrow)"/></g><text x="725" y="663.4" class="s strong" text-anchor="middle">CAB / FRONT SEATS</text><line x1="545" y1="151" x2="905" y2="151" stroke="#50647a" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="725" y="145" class="s" text-anchor="middle">150 cm</text><line x1="523" y1="190" x2="523" y2="636.4" stroke="#50647a" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text transform="translate(514 413.2) rotate(-90)" class="s" text-anchor="middle">186 cm</text><text x="675" y="325" class="b strong" text-anchor="middle">110 cm wide</text><text x="645" y="520" class="b strong" text-anchor="middle">85 cm wide</text><text x="645" y="412" class="s strong" text-anchor="middle">BED · 186 long</text><text transform="translate(857 313.6) rotate(-90)" class="s strong" text-anchor="middle">CABINETRY · 40 × 103</text><text x="827" y="492.4" class="s strong" text-anchor="middle">TOILET</text><text x="827" y="538" class="s" text-anchor="middle">40 × 48</text><text x="827" y="624.4" class="s" text-anchor="middle">35 clear</text><text x="827" y="681" class="s" text-anchor="middle">65 cm wide</text><text x="545" y="712" class="b" text-anchor="start">110 cm at shoulders; 85 cm at feet.</text><text x="545" y="740" class="b" text-anchor="start">HEAD AT REAR · toilet at front.</text><text x="545" y="768" class="b" text-anchor="start">Cuts a 25 × 83 notch from the bed.</text><text x="1020" y="123" class="h" text-anchor="start">C. Rear toilet + foot notch</text><text x="1200" y="174" class="s strong" text-anchor="middle">REAR DOORS</text><g transform="translate(1020 190) scale(2.4)"><rect width="150" height="186" fill="#fbfcfd" stroke="#23364b" stroke-width="1"/><path d="M0 0H85V83H110V186H0Z" class="bed"/><rect x="110" y="83" width="40" height="103" class="cab"/><rect x="85" y="0" width="65" height="83" class="zone"/><rect x="97.5" y="0" width="40" height="48" rx="5" class="toilet"/><ellipse cx="117.5" cy="27" rx="12" ry="15" fill="#f8edf5" stroke="#93356f" stroke-width=".8"/><path d="M117.5 54V69" stroke="#93356f" stroke-width="1.2" marker-end="url(#arrow)"/></g><text x="1200" y="663.4" class="s strong" text-anchor="middle">CAB / FRONT SEATS</text><line x1="1020" y1="151" x2="1380" y2="151" stroke="#50647a" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="1200" y="145" class="s" text-anchor="middle">150 cm</text><line x1="998" y1="190" x2="998" y2="636.4" stroke="#50647a" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text transform="translate(989 413.2) rotate(-90)" class="s" text-anchor="middle">186 cm</text><text x="1150" y="510" class="b strong" text-anchor="middle">110 cm wide</text><text x="1120" y="285" class="b strong" text-anchor="middle">85 cm wide</text><text x="1120" y="412" class="s strong" text-anchor="middle">BED · 186 long</text><text transform="translate(1332 512.8) rotate(-90)" class="s strong" text-anchor="middle">CABINETRY · 40 × 103</text><text x="1302" y="245.2" class="s strong" text-anchor="middle">TOILET</text><text x="1302" y="290.8" class="s" text-anchor="middle">40 × 48</text><text x="1302" y="377.2" class="s" text-anchor="middle">35 clear</text><text x="1302" y="411.2" class="s" text-anchor="middle">65 cm wide</text><text x="1020" y="712" class="b" text-anchor="start">110 cm at shoulders; 85 cm at feet.</text><text x="1020" y="740" class="b" text-anchor="start">HEAD AT FRONT · toilet at rear.</text><text x="1020" y="768" class="b" text-anchor="start">Rear tall cupboard must move elsewhere.</text><rect x="45" y="825" width="22" height="18" class="bed"/><text x="77" y="840" class="s">Extended mattress</text><rect x="250" y="825" width="22" height="18" class="cab"/><text x="282" y="840" class="s">Cabinetry / sink / water zone</text><rect x="570" y="825" width="22" height="18" class="zone"/><text x="602" y="840" class="s">Toilet use zone — furniture-free, not a walled cubicle</text><text x="45" y="885" class="b">Toilet: conservative BlackMOA body envelope 40 W × 48 D × 33.5 H; mounting allowances still needed.</text><text x="45" y="917" class="b">Use zone: 65 W × 83 D = 48 cm body + 35 cm front clearance. Check 100 cm above the actual seat.</text><text x="45" y="949" class="s">Lids / covers must open clear of the user. Access is from the bed; cassette access, vents and water tanks are not detailed.</text><text x="45" y="976" class="s">Body corner radii and wheel arches omitted. B/C require revised mattress cuts. Sources: PGDB guidance pp.12–13; BlackMOA product FAQ.</text></svg>
