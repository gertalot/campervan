<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title"><title id="title">Top view — day time</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#44566a"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#26374b}.heading{font-size:23px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:15px}.piece{stroke:#3d4f63;stroke-width:1.6}.dim{fill:none;stroke:#44566a;stroke-width:1.3;marker-start:url(#arrow);marker-end:url(#arrow)}.guide{stroke:#9ca9b7;stroke-width:1;stroke-dasharray:5 4}</style></defs><rect width="1100" height="900" fill="white"/><text x="45" y="45" class="heading" >Top view — day time</text><text x="45" y="77" class="body" >Agreed cushion dimensions · 150 × 186 cm cargo bay · Dimensions in cm</text><text x="325" y="138" class="label" text-anchor="middle">REAR DOORS</text><path d="M130 150 H550 V708 H100 V180 A30 30 0 0 1 130 150 Z" fill="#fafbfc" stroke="#26374b" stroke-width="2.5"/><rect x="430" y="150" width="120" height="558" fill="#edf0f4" class="piece" stroke-dasharray="7 5"/><text transform="translate(490 429) rotate(-90)" class="body" text-anchor="middle">40 cm cabinetry zone — furniture details open</text><path d="M130 150 H430 V324 H100 V180 A30 30 0 0 1 130 150 Z" fill="#ffdbac" class="piece"/><rect x="100" y="324" width="180" height="384" fill="#b9dafa" class="piece" /><rect x="130" y="150" width="300" height="30" fill="#ddd0f2" class="piece" /><rect x="100" y="240" width="30" height="84" fill="#ddd0f2" class="piece" /><rect x="100" y="324" width="30" height="384" fill="#bfe5ca" class="piece" /><path d="M130 150 V240 H100 V180 A30 30 0 0 1 130 150 Z" fill="#f3b6cb" stroke="#926779" stroke-width="1.5" stroke-dasharray="4 3"/><text x="280" y="171" class="small" text-anchor="middle">C₁ · 100</text><text transform="translate(118 198) rotate(-90)" class="small" text-anchor="middle">Pillow</text><text transform="translate(118 282) rotate(-90)" class="small" text-anchor="middle">C₂ · 28</text><text x="280" y="249" class="label" text-anchor="middle">D · 110 × 58</text><text transform="translate(118 516) rotate(-90)" class="small" text-anchor="middle">B · 128 cm backrest</text><text transform="translate(205 516) rotate(-90)" class="label" text-anchor="middle">A · Usable seat 128 × 50</text><rect x="280" y="324" width="150" height="384" fill="white" class="piece" stroke-dasharray="7 5"/><text transform="translate(355 516) rotate(-90)" class="label" text-anchor="middle">Open floor · 128 × 50</text><line x1="100" y1="109" x2="550" y2="109" class="dim"/><text x="325" y="101" class="small" text-anchor="middle">150 cargo width</text><line x1="65" y1="150" x2="65" y2="708" class="dim"/><text x="48" y="429" class="small" text-anchor="middle" transform="rotate(-90 48 429)">186 cargo length</text><line x1="100" y1="738" x2="280" y2="738" class="dim"/><text x="190" y="766" class="small" text-anchor="middle">60 seat</text><line x1="280" y1="738" x2="430" y2="738" class="dim"/><text x="355" y="766" class="small" text-anchor="middle">50 floor</text><line x1="430" y1="738" x2="550" y2="738" class="dim"/><text x="490" y="766" class="small" text-anchor="middle">40 cabinet zone</text><text x="620" y="156" class="heading" >Cushion dimensions in cm</text><rect x="620" y="178" width="18" height="18" fill="#b9dafa" class="piece" /><text x="651" y="193" class="body" >A · Long seat: 128 × 60 × 10</text><rect x="620" y="221" width="18" height="18" fill="#ffdbac" class="piece" /><text x="651" y="236" class="body" >D · Rear seat: 110 × 58 × 10</text><rect x="620" y="264" width="18" height="18" fill="#bfe5ca" class="piece" /><text x="651" y="279" class="body" >B · Backrest / infill: 128 × 25 × 10</text><rect x="620" y="307" width="18" height="18" fill="#ddd0f2" class="piece" /><text x="651" y="322" class="body" >C₁ · Rear backrest / infill: 100 × 25 × 10</text><rect x="620" y="350" width="18" height="18" fill="#ddd0f2" class="piece" /><text x="651" y="365" class="body" >C₂ · Side backrest / infill: 28 × 25 × 10</text><rect x="620" y="393" width="18" height="18" fill="#f3b6cb" class="piece" /><text x="651" y="408" class="body" >Pillow: shape and size illustrative</text><text x="620" y="490" class="heading" >Day arrangement</text><text x="620" y="525" class="body" >B supports the long seat.</text><text x="620" y="556" class="body" >C₁ supports D across the rear.</text><text x="620" y="587" class="body" >C₂ directly adjoins B along the side.</text><text x="620" y="618" class="body" >Pillow supports the rounded corner.</text><text x="45" y="820" class="small" >Rear-left radius ≈10 cm. Pillow is schematic; cabinet lengths and heights are not assigned.</text><text x="45" y="851" class="small" >A and D lie flat. B, C₁ and C₂ stand upright: 25 cm high, 10 cm thick.</text></svg>