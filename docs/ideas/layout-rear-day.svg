<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="840" viewBox="0 0 1100 840" role="img" aria-labelledby="title"><title id="title">Rear view — day time</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#44566a"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#26374b}.heading{font-size:23px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:15px}.piece{stroke:#3d4f63;stroke-width:1.6}.dim{fill:none;stroke:#44566a;stroke-width:1.3;marker-start:url(#arrow);marker-end:url(#arrow)}.guide{stroke:#9ca9b7;stroke-width:1;stroke-dasharray:5 4}</style></defs><rect width="1100" height="840" fill="white"/><text x="45" y="45" class="heading" >Rear view — day time</text><text x="45" y="77" class="body" >Foam base 45 cm · Mattress thickness 10 cm · Upright backrests 25 cm high</text><line x1="75" y1="500" x2="570" y2="500" stroke="#26374b" stroke-width="2.5"/><text x="578" y="506" class="small" >Floor</text><rect x="100" y="365" width="330" height="135" fill="#f8f9fb" class="piece" stroke-dasharray="6 5"/><text x="265" y="431" class="body" text-anchor="middle">Under-seat storage zone</text><rect x="100" y="335" width="330" height="30" fill="#ffdbac" class="piece" /><text x="265" y="358" class="small" text-anchor="middle">D · 110 wide × 10 thick</text><rect x="130" y="260" width="300" height="75" fill="#ddd0f2" class="piece" /><text x="280" y="305" class="label" text-anchor="middle">C₁ · 100 wide × 25 high</text><rect x="100" y="260" width="30" height="75" fill="#f3b6cb" class="piece" stroke-dasharray="4 3"/><text transform="translate(118 297.5) rotate(-90)" class="small" text-anchor="middle">Pillow</text><rect x="430" y="215" width="120" height="285" fill="#edf0f4" class="piece" stroke-dasharray="7 5"/><text transform="translate(490 357.5) rotate(-90)" class="body" text-anchor="middle">Cabinet zone · height not set</text><line x1="100" y1="540" x2="430" y2="540" class="dim"/><text x="265" y="566" class="small" text-anchor="middle">110 seat / bed width</text><line x1="430" y1="540" x2="550" y2="540" class="dim"/><text x="490" y="566" class="small" text-anchor="middle">40 cabinetry</text><text x="100" y="613" class="body" >View from rear doors looking towards the cab.</text><text x="100" y="645" class="small" >B and C₂ are behind the corner pillow in this projection.</text><text x="100" y="676" class="small" >Cabinet zone is illustrative only; its top edge does not specify a height.</text><line x1="65" y1="500" x2="65" y2="365" class="dim"/><text x="49" y="432.5" class="small" text-anchor="middle" transform="rotate(-90 49 432.5)">45 to foam base</text><line x1="730" y1="365" x2="730" y2="335" class="dim"/><text x="750" y="355" class="small" >10 foam</text><line x1="730" y1="335" x2="730" y2="260" class="dim"/><text x="750" y="302.5" class="small" >25 backrest</text><text x="750" y="246" class="label" >Top: 80 cm</text><text x="750" y="405" class="label" >Seat top: 55 cm</text><text x="750" y="442" class="label" >Foam base: 45 cm</text><text x="45" y="765" class="small" >Heights measured from the floor. Backrests sit on top of the seat cushions.</text><text x="45" y="797" class="small" >Dashed storage outlines show space allocation, not a designed frame or verified clear opening.</text></svg>