<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900"><title>Front-L layout · rear view · DAY</title><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#26394b}.h{font-size:24px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.shape{stroke:#53677a;stroke-width:1.5}.dim{stroke:#53677a;stroke-width:1.2;marker-start:url(#a);marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677a"/></marker></defs><rect width="1100" height="900" fill="white"/><text x="40" y="44" class="h">Front-L layout · rear view · DAY</text><text x="40" y="77" class="b">Looking forwards from rear doors · front return bench is farther away</text><rect x="100" y="365" width="321" height="135" fill="#fff5e8" class="shape" stroke-dasharray="6 4"/><rect x="100" y="335" width="321" height="30" fill="#ffdbac" class="shape" stroke-dasharray="6 4"/><rect x="130" y="260" width="210" height="75" fill="#ddd0f2" class="shape" stroke-dasharray="6 4"/><rect x="100" y="365" width="171" height="135" fill="#f6f8fa" class="shape" stroke-dasharray="6 4"/><rect x="100" y="335" width="171" height="30" fill="#b9dafa" class="shape"/><rect x="100" y="260" width="30" height="75" fill="#bfe5ca" class="shape"/><rect x="310" y="410" width="111" height="90" fill="none" class="shape" stroke-dasharray="6 4"/><text x="365.5" y="451" class="s" text-anchor="middle">Toilet*</text><text x="365.5" y="477" class="s" text-anchor="middle">farther forward</text><rect x="421" y="200" width="129" height="300" fill="#f1eadf" class="shape" stroke-dasharray="6 4"/><text transform="translate(485.5 350) rotate(-90)" class="b" text-anchor="middle">Cabinet zone · height not set</text><text x="200" y="356" class="s" text-anchor="middle">A · 57 wide</text><text x="346" y="356" class="s" text-anchor="middle">D behind</text><text x="235" y="305" class="s" text-anchor="middle">C₁ · 70 across · 25 high</text><line x1="75" y1="500" x2="575" y2="500" stroke="#26394b" stroke-width="2"/><line x1="100" y1="541" x2="271" y2="541" class="dim"/><text x="185.5" y="567" class="s" text-anchor="middle">57 side seat</text><line x1="271" y1="541" x2="421" y2="541" class="dim"/><text x="346" y="567" class="s" text-anchor="middle">50 aisle</text><line x1="421" y1="541" x2="550" y2="541" class="dim"/><text x="485.5" y="567" class="s" text-anchor="middle">43 cabinets</text><line x1="100" y1="620" x2="421" y2="620" class="dim"/><text x="260.5" y="647" class="s" text-anchor="middle">107 front bench / bed</text><text x="620" y="190" class="h" text-anchor="start">Height from floor</text><text x="620" y="226" class="b" text-anchor="start">Foam underside: 45</text><text x="620" y="255" class="b" text-anchor="start">Seat foam: 10 thick</text><text x="620" y="284" class="b" text-anchor="start">Seat top: 55</text><text x="620" y="313" class="b" text-anchor="start">Backrest top: 80</text><text x="620" y="420" class="h" text-anchor="start">Reading this view</text><text x="620" y="456" class="b" text-anchor="start">A and B are nearest the rear.</text><text x="620" y="485" class="b" text-anchor="start">D and C₁ sit near the cab.</text><text x="620" y="514" class="b" text-anchor="start">Toilet candidate is below D.</text><text x="620" y="543" class="b" text-anchor="start">Cabinet height is unspecified.</text><text x="40" y="800" class="s" text-anchor="start">The 50 cm rear aisle ends at the front return bench; it is not a full-length passage.</text><text x="40" y="830" class="s" text-anchor="start">Farther furniture is dashed where shown through nearer furniture. C₂ is behind B in this projection.</text><text x="40" y="860" class="s" text-anchor="start">*Toilet stowage only, not a completed installation. Cabinet top edge is illustrative.</text><line x1="340" y1="240" x2="421" y2="240" class="dim"/><text x="380.5" y="228" class="s" text-anchor="middle">27 gap</text></svg>
