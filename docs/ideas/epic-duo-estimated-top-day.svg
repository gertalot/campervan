<rect x="132" y="760" width="120" height="65" rx="12" fill="#e7ebef" stroke="#81909f"/><rect x="316" y="760" width="120" height="65" rx="12" fill="#e7ebef" stroke="#81909f"/>
<text x="192" y="800" font-size="16" text-anchor="middle" >Passenger seat</text>
<text x="376" y="800" font-size="16" text-anchor="middle" >Driver seat</text>
<text x="284" y="858" font-size="16" text-anchor="middle" font-weight="700">CAB · outside the 210 cm rectangle</text>
<text x="525" y="158" font-size="23" text-anchor="start" font-weight="700">Published reference dimensions</text>
<text x="525" y="198" font-size="18" text-anchor="start" >EPIC: rear interior 145 W × 210 L × 140 H.</text>
<text x="525" y="235" font-size="18" text-anchor="start" >Nissan brochure: maximum cargo</text>
<text x="525" y="265" font-size="18" text-anchor="start" >150 W × 204 L × 135.8 H.</text>
<text x="525" y="302" font-size="18" text-anchor="start" >Rear opening: 126.2 W × 122.8 H.</text>
<text x="525" y="416" font-size="18" text-anchor="start" >Long bench: ≈165 L × 65 W.</text>
<text x="525" y="487" font-size="18" text-anchor="start" >Front return: ≈105 across × 45 deep.</text>
<text x="525" y="558" font-size="18" text-anchor="start" >Left cabinetry: ≈25 deep × 100 long.</text>
<text x="525" y="630" font-size="18" text-anchor="start" >Front return extends ≈40 cm left of the long bench.</text>
<text x="525" y="791" font-size="18" text-anchor="start" >Dotted: stowed under the front return.</text>
<text x="525" y="824" font-size="18" text-anchor="start" >Pink: illustrative slide-out position.</text>
<text x="525" y="857" font-size="18" text-anchor="start" >Slides sideways; user faces rear (upwards).</text>
<text x="525" y="337" font-size="15" text-anchor="start" >Brochure references are not measurements of this van.</text>
<text x="525" y="362" font-size="15" text-anchor="start" >EPIC’s published figures are rounded.</text>
<text x="525" y="384" font-size="23" text-anchor="start" font-weight="700">Photo estimates · not measured</text>
<text x="525" y="449" font-size="16" text-anchor="start" >Range: 155–175 long, 60–70 wide.</text>
<text x="525" y="520" font-size="16" text-anchor="start" >Range: 100–115 across, 40–50 deep.</text>
<text x="525" y="591" font-size="16" text-anchor="start" >Range: 20–30 deep, 80–120 long.</text>
<text x="525" y="663" font-size="16" text-anchor="start" >165 + 45 = 210 total; bench rectangles meet.</text>
<text x="525" y="745" font-size="23" text-anchor="start" font-weight="700">Toilet interpretation</text>
<text x="525" y="890" font-size="15" text-anchor="start" >35 × 42 toilet symbol: illustrative; model unidentified.</text>
<text x="40" y="935" font-size="15" text-anchor="start" >Approximate reconstruction, not EPIC’s construction drawing or proof of night clearance. Trim / wheel arches simplified.</text>
<text x="40" y="961" font-size="15" text-anchor="start" >Widths are better constrained than lengths. *Table size and toilet travel are schematic.</text>
<text x="40" y="987" font-size="15" text-anchor="start" >EPIC’s 210 cm envelope is shown; this has not been shortened to your 186 cm space.</text>
</g></svg>
